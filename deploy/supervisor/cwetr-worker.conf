; Laravel queue + scheduler workers for CWETR.
; Install: symlink into /etc/supervisor/conf.d/ then
;   supervisorctl reread && supervisorctl update
; enable once /opt/resorts/backend is deployed:

[program:cwetr-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /opt/resorts/backend/current/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/opt/resorts/backend/current
autostart=true
autorestart=true
user=ubuntu
numprocs=2
redirect_stderr=true
stdout_logfile=/opt/resorts/logs/queue-worker.log
stopwaitsecs=3600

[program:cwetr-scheduler]
command=bash -c "while true; do php /opt/resorts/backend/current/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/opt/resorts/backend/current
autostart=true
autorestart=true
user=ubuntu
redirect_stderr=true
stdout_logfile=/opt/resorts/logs/scheduler.log
