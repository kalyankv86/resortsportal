# =============================================================================
# CWETR Enterprise Portal — Nginx vhost
#   /            → Next.js frontend  (PM2, 127.0.0.1:3000)
#   /api /sanctum/... → Laravel API  (php8.3-fpm, /opt/resorts/backend/public)
#   /media/      → static media library  (/opt/resorts/media)
# Deploy: symlink into /etc/nginx/sites-enabled/ then `nginx -t && systemctl reload nginx`
# =============================================================================

upstream cwetr_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- HTTP :80 -------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wellness.cutm.ac.in 192.168.5.51 _;

    # ACME challenge for certbot (kept on :80 even after TLS is enabled)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Until real DNS + Let's Encrypt exist, serve straight over :80.
    # After `certbot --nginx -d wellness.cutm.ac.in`, certbot injects the
    # redirect to :443 here automatically.
    include /opt/resorts/src/deploy/nginx/_app.conf;
}

# ---- HTTPS :443 (self-signed until certbot runs) ------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wellness.cutm.ac.in 192.168.5.51;

    ssl_certificate     /etc/nginx/ssl/cwetr-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/cwetr-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /opt/resorts/src/deploy/nginx/_app.conf;
}
