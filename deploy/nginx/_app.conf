# Shared location block — included by both the :80 and :443 servers.

client_max_body_size 32m;      # guest medical-report uploads
charset utf-8;

access_log /opt/resorts/logs/nginx-access.log;
error_log  /opt/resorts/logs/nginx-error.log;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;

# security headers
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ---- media library (served straight off disk) --------------------------
location /media/ {
    alias /opt/resorts/media/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---- Laravel API + auth + storage -------------------------------------
location ~ ^/(api|sanctum|storage|up)(/|$) {
    root /opt/resorts/backend/public;
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    root /opt/resorts/backend/public;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60;
}

# ---- Next.js static assets (long cache) ------------------------------
location /_next/static/ {
    proxy_pass http://cwetr_frontend;
    proxy_cache_valid 200 60m;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# ---- everything else → Next.js -------------------------------------
location / {
    proxy_pass http://cwetr_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60;
}
